<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tactical Strike: 3D Tactical FPS</title>
<style>
  :root {
    --canvas: #101318;
    --surface: #1c2028;
    --hairline: #2d3340;
    --ink: #f5f2ea;
    --muted: #8b96a7;
    --accent: #e89728;
    --ct-blue: #4b94ea;
    --t-yellow: #e8a338;
    --danger: #e64c4c;
    --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-readout: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-ui);
    user-select: none;
  }
  #game, #game canvas { position: fixed; inset: 0; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }

  /* Tactical Crosshair */
  #crosshair { position: fixed; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); }
  #crosshair i { position: absolute; background: #00ffcc; opacity: 0.9; }
  #crosshair i:nth-child(1) { left: 9px; top: 0; width: 2px; height: 6px; }
  #crosshair i:nth-child(2) { left: 9px; bottom: 0; width: 2px; height: 6px; }
  #crosshair i:nth-child(3) { top: 9px; left: 0; height: 2px; width: 6px; }
  #crosshair i:nth-child(4) { top: 9px; right: 0; height: 2px; width: 6px; }

  /* Hitmarker */
  #hitmarker { position: fixed; left: 50%; top: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%) rotate(45deg); opacity: 0; transition: opacity 80ms; }
  #hitmarker.on { opacity: 1; }
  #hitmarker i { position: absolute; background: var(--accent); }
  #hitmarker.kill i { background: var(--danger); }
  #hitmarker i:nth-child(1) { left: 11px; top: 0; width: 2px; height: 7px; }
  #hitmarker i:nth-child(2) { left: 11px; bottom: 0; width: 2px; height: 7px; }
  #hitmarker i:nth-child(3) { top: 11px; left: 0; height: 2px; width: 7px; }
  #hitmarker i:nth-child(4) { top: 11px; right: 0; height: 2px; width: 7px; }

  /* Top Bar Scoreboard */
  #top-bar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 20px;
    background: rgba(28, 32, 40, 0.85);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    font-family: var(--font-readout);
    font-size: 20px;
    font-weight: 700;
  }
  .ct-tag { color: var(--ct-blue); }
  .t-tag { color: var(--t-yellow); }
  #round-timer { color: var(--ink); min-width: 55px; text-align: center; }

  /* Radar */
  #radar-panel {
    position: fixed;
    top: 16px;
    left: 16px;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    overflow: hidden;
    background: rgba(16, 19, 24, 0.85);
  }

  /* Bottom Left Vitals */
  #vitals {
    position: fixed;
    bottom: 24px;
    left: 24px;
    display: flex;
    gap: 20px;
    font-family: var(--font-readout);
  }
  .vital-box {
    display: flex;
    align-items: baseline;
    gap: 6px;
    background: rgba(28, 32, 40, 0.85);
    padding: 8px 16px;
    border: 1px solid var(--hairline);
    border-radius: 4px;
  }
  .vital-box .label { font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .vital-box .val { font-size: 32px; font-weight: 700; color: var(--ink); }
  #health-val { color: #52e396; }
  #money-val { color: var(--accent); }

  /* Bottom Right Ammo */
  #ammo {
    position: fixed;
    right: 24px;
    bottom: 24px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: rgba(28, 32, 40, 0.85);
    padding: 8px 20px;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    font-family: var(--font-readout);
    font-size: 44px;
    font-weight: 700;
    color: var(--ink);
  }
  #ammo.empty #ammo-mag { color: var(--danger); }
  #ammo-reserve { font-size: 18px; color: var(--muted); }

  /* Killfeed */
  #killfeed {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-family: var(--font-readout);
    font-size: 13px;
    pointer-events: none;
  }
  .kill-item {
    background: rgba(20, 24, 32, 0.85);
    padding: 4px 10px;
    border-left: 3px solid var(--accent);
    border-radius: 2px;
    transition: opacity 0.3s;
  }
  .kill-item .killer { color: var(--ct-blue); font-weight: 700; }
  .kill-item .victim { color: var(--t-yellow); font-weight: 700; }

  /* Objective Banner */
  #objective-banner {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(230, 76, 76, 0.9);
    color: #fff;
    padding: 6px 18px;
    border-radius: 4px;
    font-family: var(--font-readout);
    font-size: 14px;
    font-weight: 700;
    display: none;
    text-align: center;
  }
  #objective-banner .bar {
    height: 4px;
    background: #fff;
    margin-top: 4px;
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  /* Overlay Modal */
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(16, 19, 24, 0.88);
  }
  .overlay[hidden] { display: none; }
  .panel {
    width: min(480px, 90%);
    padding: 32px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    text-align: center;
  }
  .panel h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -0.02em; }
  .panel p { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .btn {
    padding: 12px 28px;
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Buy Menu Modal */
  #buy-menu {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(16, 19, 24, 0.85);
    z-index: 100;
  }
  .buy-grid {
    display: grid;
    grid-template-columns: repeat(2, 220px);
    gap: 12px;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 6px;
  }
  .buy-btn {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    background: #252b36;
    border: 1px solid var(--hairline);
    color: var(--ink);
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font-readout);
    font-size: 13px;
  }
  .buy-btn:hover { background: #323a48; border-color: var(--accent); }
  .buy-btn .price { color: var(--accent); font-weight: 700; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div id="radar-panel">
    <canvas id="radar" width="130" height="130"></canvas>
  </div>

  <div id="top-bar">
    <span class="ct-tag">CT <span id="score-ct">0</span></span>
    <span id="round-timer">01:55</span>
    <span class="t-tag"><span id="score-t">0</span> T</span>
  </div>

  <div id="killfeed"></div>
  <div id="objective-banner"></div>

  <div id="crosshair"><i></i><i></i><i></i><i></i></div>
  <div id="hitmarker"><i></i><i></i><i></i><i></i></div>

  <div id="vitals">
    <div class="vital-box"><span class="label">+</span><span class="val" id="health-val">100</span></div>
    <div class="vital-box"><span class="label">🛡️</span><span class="val" id="armor-val">100</span></div>
    <div class="vital-box"><span class="label">💰</span><span class="val" id="money-val">$800</span></div>
  </div>

  <div id="ammo">
    <span id="ammo-mag">30</span>
    <span id="ammo-reserve">/ 90</span>
  </div>
</div>

<div id="buy-menu">
  <div class="buy-grid">
    <div class="buy-btn" data-buy="deagle"><span>1. Desert Eagle</span><span class="price">$700</span></div>
    <div class="buy-btn" data-buy="mp5"><span>2. MP5-SD</span><span class="price">$1500</span></div>
    <div class="buy-btn" data-buy="ak47"><span>3. AK-47 Rifle</span><span class="price">$2700</span></div>
    <div class="buy-btn" data-buy="awp"><span>4. AWP Sniper</span><span class="price">$4750</span></div>
    <div class="buy-btn" data-buy="armor"><span>5. Kevlar Vest</span><span class="price">$650</span></div>
    <div class="buy-btn" data-buy="defuseKit"><span>6. Defusal Kit</span><span class="price">$400</span></div>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="panel">
    <h1 id="overlay-title">TACTICAL STRIKE</h1>
    <p id="overlay-msg">Eliminate opposing team or plant/defuse the C4 objective at Bomb Site A or B.</p>
    <button id="play-btn" class="btn">DEPLOY TO MISSION</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
